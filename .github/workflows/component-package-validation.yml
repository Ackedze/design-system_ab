name: V3 rule validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: shared/design-system_ab
      - uses: actions/checkout@v5
        with:
          repository: Ackedze/apollo
          ref: fba40a5f1a9be105ea77794cfd825d453f6981ba
          path: projects/Apollo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/Apollo/package-lock.json
      - run: npm ci
        working-directory: projects/Apollo
      - name: Test authoring, execution and reports with the V3 evaluators
        env:
          APOLLO_ROOT: ${{ github.workspace }}/projects/Apollo
        run: node --test apollo/scripts/v3-rule-author.test.cjs
        working-directory: shared/design-system_ab
